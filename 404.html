<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phở Tasty — Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100%;
      background: radial-gradient(ellipse 70% 50% at 50% 30%, #2a160c 0%, #170a07 50%, #07040a 100%);
      color: #f4e6c6;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 540px; padding: 60px 28px; }
    .num {
      font-family: 'Italianno', cursive;
      font-size: clamp(140px, 22vw, 220px);
      line-height: .9;
      color: #f4e6c6;
      text-shadow: 0 0 30px rgba(255,140,70,.35), 0 0 80px rgba(255,90,30,.15);
      margin: 0;
    }
    .label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: 14px; letter-spacing: .5em; text-transform: uppercase;
      color: #d8a04a;
      margin-bottom: 14px;
    }
    p {
      font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
      font-size: 18px; line-height: 1.6;
      color: rgba(244,230,198,.85);
      margin: 22px 0 36px;
    }
    a {
      display: inline-block;
      padding: 14px 40px;
      font-size: 12px; letter-spacing: .5em; text-transform: uppercase;
      color: #ffe5b0; text-decoration: none;
      background: rgba(20,8,6,.4);
      border: 1px solid rgba(255,160,80,.45);
      transition: color .3s, border-color .3s, transform .3s;
    }
    a:hover {
      color: #fff5d8;
      border-color: rgba(255,200,120,.85);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="label">Lost on the way</p>
    <h1 class="num">404</h1>
    <p>The bowl you were looking for is not on the table.<br />Let's get you back to the alley.</p>
    <a href="./">Return Home</a>
  </main>
</body>
</html>
